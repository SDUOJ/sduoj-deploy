schema_version: 1
kind: design_catalog
engine: openhands-sdk
execution_owner: auto_task.worker
task_type: agent.run
default_enabled: false
runtime_policy:
  global_setting_id: agent_components
  setting_store: AiSetting
  unknown_component: deny
  unknown_version: deny
  unknown_action: deny
  missing_config: disabled
  dynamic_code_install: false
  raw_provider_key_in_agent: false
  human_confirmation: finish_turn_and_use_current_browser_session
  history_when_disabled: original_read_permission
  legacy_ingress_gating_required: true
  source: reviewed-20261018
  sdk_process: worker_owned_separate_python_runtime
  ipc: bounded_schema_json
  component_generation: monotonic_including_global_disable_and_reenable
  approval_lifecycle: durable_candidate_independent_of_active_worker_lease
  generation_tuple:
  - global
  - component
  - action
  host_config_autoload: false
  dependency_generations: freeze_transitive_dependencies_and_allowed_cross_component_targets
  tools_projection: current_action_and_profile_allowlist_with_server_gate
  sandbox_requires_original_deployment_permission: true
components:
- id: content.review
  title: 内容审核（内部组件）
