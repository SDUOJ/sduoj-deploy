  execution_profile: business_tools
  requires_endpoint: true
  required_model_capabilities:
  - tools
  - structured_output
  actions:
  - review
  tools:
  - content.read_task_input
  - content.propose_moderation
  resource_kinds:
  - document
  - collection
  - question
  - authoring
  - conversation
  - grading
  - plagiarism
  - ide
  - course
  - interview
  - exam
  frontend_surfaces:
  - manage
  visibility: internal_service
  dependencies: []
  legacy_bindings: []
  java_strategy: autolab_only
  result_policy: pending_review_until_validated_policy_decision
  source_authorization: fresh_original_resource_permission
  legacy_hook: handlers.moderation_and_legacy_bridge.moderation_including_course.index
