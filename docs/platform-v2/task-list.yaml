change_control:
- rule: 本轮仅审计/完善文档，不授权实际DDL、鉴权、网关、沙箱、密钥或生产修改。
- rule: 按已确认整理基线开需求分支；一个PR/commit一个目的，保留原供应链与发布流程，无授权不push。
- rule: DDL集中06、REST路径集中07；先兼容读者再回填/放写，真实MySQL/Redis/服务链和恢复必须有证据。
- rule: TaskJob/ModelProxy/原审批和账本不重建；旧任务冻结配置，v2无隐式站点provider兜底。
- rule: 回退关闭新写并对账，保留schema/账本/外部receipt；混合数据写入后不能回任意旧代码。
- rule: 确定性查重/材料/本地解析不依赖AI；发布、代用户写、匿名能力入口分别放行。
