    until: S6-02 完成

change_control:
  - rule: 涉及既有表中已有语义的改动（如 problem_group.type）必须先读后写、两步上线（先读兼容再放开写）
  - rule: 新增列一律可空或带默认值，保证旧版本代码可继续运行
  - rule: 任何 P0 安全项未完成前，对应功能不得对外开放
  - rule: 前端路由与后端能力同批上线；oj_unified_problem 不可单独回滚
