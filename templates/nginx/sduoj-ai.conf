# Review artifact. This keeps Web2 and all API/session traffic on one origin.
# TLS, certificate paths, rate limits, and the Gateway address must be set for
# the target host before this file is enabled.
upstream sduoj_gateway {
    server 127.0.0.1:8080;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name oj.example.invalid;

    client_max_body_size 52m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location = / {
        return 302 /v2/;
    }

    location ^~ /v2/ {
        alias /srv/sduoj-ai/current/web2/;
        try_files $uri $uri/ /v2/index.html;
    }

    location ^~ /api/ {
        proxy_pass http://sduoj_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering on;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location ^~ /ws/ {
        proxy_pass http://sduoj_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
